name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # sentence-transformers is optional at runtime (auto-falls-back to
          # TF-IDF), so CI installs the lean requirement set for speed.
          # Swap in requirements.txt if you want CI to exercise the full
          # semantic embedding path.
          pip install chromadb scikit-learn networkx numpy requests fastapi \
                      "uvicorn[standard]" pydantic mcp python-docx pytest httpx

      - name: Lint (compile check)
        run: python -m py_compile $(find src -name "*.py")

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v

      - name: Smoke-test API boot
        run: |
          PYTHONPATH=. python -c "
          from fastapi.testclient import TestClient
          from src.api.main import app
          client = TestClient(app)
          resp = client.get('/health')
          assert resp.status_code == 200, resp.text
          print('API boots and responds:', resp.json())
          "
