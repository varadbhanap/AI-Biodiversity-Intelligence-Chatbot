<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Darukaa.Earth — Biodiversity Intelligence Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1a13;
    --panel: #16241a;
    --accent: #6fbf73;
    --accent-dim: #3f6b45;
    --text: #e7f0e8;
    --muted: #93a696;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--accent-dim);
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent-dim); }
  .system { align-self: flex-start; background: var(--panel); border: 1px solid var(--accent-dim); }
  .card { border-left: 3px solid var(--accent); padding-left: 12px; margin-top: 8px; }
  .card h4 { margin: 0 0 4px; color: var(--accent); font-size: 14px; }
  .meta { color: var(--muted); font-size: 12px; }
  #inputRow { display: flex; gap: 8px; padding: 16px; border-top: 1px solid var(--accent-dim); background: var(--panel); }
  #inputRow input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--accent-dim);
    background: #0c150f;
    color: var(--text);
    font-size: 14px;
  }
  #inputRow button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0c150f;
    font-weight: 600;
    cursor: pointer;
  }
  #inputRow button:hover { background: #85d488; }
</style>
</head>
<body>
<header>
  <h1>🌱 Darukaa.Earth — Biodiversity Intelligence</h1>
</header>
<div id="chat"></div>
<div id="inputRow">
  <input id="msgInput" placeholder="e.g. Biodiversity is declining on my land, SOC 0.3%, monoculture wheat, semi-arid, low rainfall" />
  <button onclick="send()">Send</button>
</div>

<script>
const sessionId = "web-" + Math.random().toString(36).slice(2);
const chat = document.getElementById("chat");
const API_BASE = ""; // same origin

function addMessage(role, html) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderAssessment(data) {
  let html = `<div class="meta">Considered ${data.num_variables_considered} variable(s) · ${data.limiting_metrics.length} limiting factor(s) found</div>`;

  if (data.limiting_metrics.length) {
    html += `<div class="card"><h4>Limiting metrics</h4>`;
    data.limiting_metrics.forEach(m => {
      html += `<div>• <b>${m.metric}</b> = ${m.value} (${m.severity}) — affects ${m.num_downstream_effects} downstream metric(s)</div>`;
    });
    html += `</div>`;
  }

  if (data.cross_metric_links && data.cross_metric_links.length) {
    html += `<div class="card"><h4>Cross-metric links found</h4>`;
    data.cross_metric_links.forEach(([a, b]) => {
      html += `<div>• ${a} ↔ ${b}</div>`;
    });
    html += `</div>`;
  }

  data.recommendations.forEach((r, i) => {
    html += `<div class="card"><h4>Recommendation ${i+1}: ${escapeHtml(r.recommendation)}</h4>`;
    html += `<div>${escapeHtml(r.why_it_works)}</div>`;
    html += `<div class="meta">Primary effect: ${r.primary_effect.metric} ${r.primary_effect.estimate}</div>`;
    if (r.secondary_effects && r.secondary_effects.length) {
      html += `<div class="meta">Also improves: ${r.secondary_effects.map(e => e.metric + " (" + e.estimate + ")").join(", ")}</div>`;
    }
    html += `<div class="meta">Time horizon: ${r.time_horizon} · Confidence: ${r.confidence}</div>`;
    html += `<div class="meta">Reference: ${escapeHtml(r.reference)}</div>`;
    if (r.supporting_evidence && r.supporting_evidence.length) {
      html += `<div class="meta">Retrieved evidence from: ${r.supporting_evidence.map(e => e.title).join(", ")}</div>`;
    }
    html += `</div>`;
  });

  if (data.still_missing && data.still_missing.length) {
    html += `<div class="meta">Still unknown (would refine results further): ${data.still_missing.join(", ")}</div>`;
  }
  return html;
}

async function send() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;
  addMessage("user", escapeHtml(text));
  input.value = "";

  const body = { session_id: sessionId, message: text };

  const resp = await fetch(API_BASE + "/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await resp.json();

  if (data.type === "clarifying_question") {
    let html = escapeHtml(data.question);
    if (data.geo_note) html += `<div class="meta">${escapeHtml(data.geo_note)}</div>`;
    addMessage("system", html);
  } else {
    addMessage("system", renderAssessment(data));
  }
}

document.getElementById("msgInput").addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

addMessage("system", "Tell me about the land you're assessing — soil, rainfall, land use, anything you know. I'll ask for what's missing.");
</script>
</body>
</html>
